# Burak Akgünoğlu Uzak Bağlantı - kendi kimlik (hbbs) ve relay (hbbr) sunucunuz.
# RustDesk Server OSS (AGPL-3.0): https://github.com/rustdesk/rustdesk-server
services:
  hbbs:
    container_name: hbbs
    image: rustdesk/rustdesk-server:latest
    command: hbbs
    volumes:
      - ./data:/root
    network_mode: host
    depends_on:
      - hbbr
    restart: unless-stopped

  hbbr:
    container_name: hbbr
    image: rustdesk/rustdesk-server:latest
    command: hbbr
    volumes:
      - ./data:/root
    network_mode: host
    restart: unless-stopped
